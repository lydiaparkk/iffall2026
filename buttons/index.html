<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>Buttons — Lydia Park</title>

		<link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700,800" rel="stylesheet" type="text/css">
		<link href="https://fonts.googleapis.com/css?family=Montserrat:500" rel="stylesheet" type="text/css">
		<link href="https://fonts.googleapis.com/css?family=Bungee|Libre+Caslon+Text:400,400i|Luckiest+Guy" rel="stylesheet" type="text/css">

		<link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet" integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN" crossorigin="anonymous">

		<style>

			body {
				color: #333;
				font-family: 'Open Sans', sans-serif;
				margin: 0;
				padding: 0;
			}

			main {
				margin: 40px;
			}

			h1 {
			 	font-size: 30px;
			 	margin-bottom: 40px;
			}

			.button_container {
				border: 1px solid #ddd;
				margin: 0 10px 10px 0;
				padding: 20px;
				width: 300px;
				height: 300px;
				float: left;
				overflow: hidden;
				box-sizing: border-box;
				text-align: center;
			}



			a#btn_apple {
				display: inline-block;
				margin-top: 108px;
				padding: 12px 28px;
				border-radius: 980px;
				background-color: #1d1d1f;
				color: #fff;
				font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
				font-size: 17px;
				letter-spacing: -0.2px;
				text-decoration: none;
				transition: background-color .3s;
			}

			a#btn_apple .fa-apple {
				margin-right: 6px;
				font-size: 19px;
			}

			a#btn_apple .fa-angle-right {
				margin-left: 0;
				opacity: 0;
				transition: margin-left .3s, opacity .3s;
			}

			a#btn_apple:hover {
				background-color: #0071e3;
			}

			a#btn_apple:hover .fa-angle-right {
				margin-left: 10px;
				opacity: 1;
			}

			a#btn_nerf {
				display: inline-block;
				position: relative;
				width: 110px;
				height: 110px;
				margin-top: 75px;
				color: #fff;
				font-family: 'Bungee', sans-serif;
				font-size: 22px;
				line-height: 110px;
				text-decoration: none;
				transform: perspective(600px) rotateY(0deg);
				transform-style: preserve-3d;
				transition: transform .6s;
			}

			a#btn_nerf span {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				border-radius: 50%;
				-webkit-backface-visibility: hidden;
				backface-visibility: hidden;
			}

			a#btn_nerf .front {
				background-color: #ff6a13;
				box-shadow: 0 0 0 5px #fff, 0 0 0 9px #0057b8;
			}

			a#btn_nerf .back {
				background-color: #0057b8;
				box-shadow: 0 0 0 5px #fff, 0 0 0 9px #ff6a13;
				transform: rotateY(180deg);
			}

			a#btn_nerf:hover {
				transform: perspective(600px) rotateY(180deg);
			}

			a#btn_newyorker {
				display: inline-block;
				position: relative;
				margin-top: 100px;
				padding: 16px 40px 16px 30px;
				border: 1px solid #000;
				background-color: #f6f1e7;
				color: #000;
				font-family: 'Libre Caslon Text', Georgia, serif;
				font-size: 22px;
				font-style: italic;
				text-decoration: none;
			}

			a#btn_newyorker:after {
				content: "";
				position: absolute;
				top: -1px;
				right: -1px;
				border-style: solid;
				border-width: 0 16px 16px 0;
				border-color: #fff #fff #d8cdb8 #d8cdb8;
				transition: border-width .3s;
			}

			a#btn_newyorker:hover:after {
				border-width: 0 28px 28px 0;
			}

			a#btn_tesla {
				display: inline-block;
				position: relative;
				margin-top: 104px;
				padding: 12px 36px;
				border: 2px solid #171a20;
				color: #171a20;
				font-family: 'Montserrat', sans-serif;
				font-size: 15px;
				font-weight: 500;
				text-transform: uppercase;
				letter-spacing: 4px;
				text-decoration: none;
				transition: color .4s;
			}

			a#btn_tesla:before {
				content: "";
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: #171a20;
				transform: scaleX(0);
				transform-origin: left;
				transition: transform .4s;
			}

			a#btn_tesla span {
				position: relative;
			}

			a#btn_tesla:hover {
				color: #fff;
			}

			a#btn_tesla:hover:before {
				transform: scaleX(1);
			}

			a#btn_kittens {
				display: inline-block;
				margin-top: 100px;
				padding: 12px 18px 8px 18px;
				border: 3px solid #000;
				border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
				background-color: #fff;
				color: #e1251b;
				font-family: 'Luckiest Guy', sans-serif;
				font-size: 20px;
				white-space: nowrap;
				text-decoration: none;
				transition: transform .35s cubic-bezier(.34, 1.8, .64, 1), box-shadow .35s, background-color .2s;
			}

			a#btn_kittens i {
				margin-right: 8px;
				color: #000;
				transition: color .2s;
			}

			a#btn_kittens:hover {
				background-color: #ffd23f;
				box-shadow: 6px 6px 0 #000;
				transform: scale(1.12) rotate(-3deg);
			}

			a#btn_kittens:hover i {
				color: #e1251b;
			}

		</style>
	</head>
	<body>

		<main>

			<h1>Button Styling — Lydia Park</h1>

			<div class="button_container">
				<a href="http://www.apple.com/" target="_blank" id="btn_apple"><i class="fa fa-apple"></i>Apple<i class="fa fa-angle-right"></i></a>
			</div>

			<div class="button_container">
				<a href="http://nerf.hasbro.com/en-us" target="_blank" id="btn_nerf"><span class="front">Nerf</span><span class="back">Fire!</span></a>
			</div>

			<div class="button_container">
				<a href="http://www.newyorker.com/" target="_blank" id="btn_newyorker">The New Yorker</a>
			</div>

			<div class="button_container">
				<a href="http://www.teslamotors.com/" target="_blank" id="btn_tesla"><span>Tesla</span></a>
			</div>

			<div class="button_container">
				<a href="http://www.explodingkittens.com/" target="_blank" id="btn_kittens"><i class="fa fa-bomb"></i>Exploding Kittens</a>
			</div>

		</main>

	</body>
</html>
