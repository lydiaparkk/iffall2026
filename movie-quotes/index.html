<header>
    <h1>Ghostbusters (1984)</h1>
  </header>

<main>
      <h2><cite>Movie Quotes edited by: Lydia Park</cite></h2>

    <figure>
      <blockquote>
        <p><b>Dr. Peter Venkman:</b> What I'd really like to do is talk to Dana. Dana? It's Peter.</p>
        <p><b>Dana Barrett:</b> There is no Dana, there is only Zuul.</p>
        <p><b>Dr. Peter Venkman:</b> Oh, Zuulie, you nut, now c'mon. Just relax, c'mon. I want to talk to Dana. Dana, Dana. Can I talk to Dana?</p>
        <p><b>Dana Barrett:</b> <i>[in an inhuman demonic voice]</i> There is no Dana, only Zuul!</p>
        <p><b>Dr. Peter Venkman:</b> What a lovely singing voice you must have.</p>
      </blockquote>
      <figcaption>Dana's apartment, <cite>Ghostbusters</cite> (1984)</figcaption>
    </figure>

    <figure>
      <blockquote>
        <p><b>Dr. Peter Venkman:</b> This city is headed for a disaster of biblical proportions.</p>
        <p><b>Mayor:</b> What do you mean, "biblical?"</p>
        <p><b>Dr. Ray Stantz:</b> What he means is Old Testament, Mr. Mayor, real wrath of God type stuff.</p>
        <p><b>Dr. Peter Venkman:</b> Exactly.</p>
        <p><b>Dr. Ray Stantz:</b> Fire and brimstone coming down from the skies! Rivers and seas boiling!</p>
        <p><b>Dr. Egon Spengler:</b> Forty years of darkness! Earthquakes, volcanoes...</p>
        <p><b>Winston Zeddemore:</b> The dead rising from the grave!</p>
        <p><b>Dr. Peter Venkman:</b> Human sacrifice, dogs and cats living together... mass hysteria!</p>
        <p><b>Mayor:</b> All right, all right! I get the point!</p>
      </blockquote>
      <figcaption>The Mayor's office, <cite>Ghostbusters</cite> (1984)</figcaption>
    </figure>

    <figure>
      <blockquote>
        <p><i>[Clearing away tables in the dining room to make room for the ghost trap]</i></p>
        <p><b>Dr. Ray Stantz:</b> I've gotta get this in the clear...!</p>
        <p><b>Dr. Peter Venkman:</b> Wait, wait, wait! I've always wanted to do this...</p>
        <p><i>[He yanks a tablecloth off of a table, overturning and shattering everything except the centerpiece in the middle]</i></p>
        <p><b>Dr. Peter Venkman:</b> <i>[triumphantly]</i> And the flowers are still standing!</p>
      </blockquote>
      <figcaption>The Sedgewick Hotel, <cite>Ghostbusters</cite> (1984)</figcaption>
    </figure>
