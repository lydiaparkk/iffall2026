<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luna Moth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="logo" href="#">Luna Moth</a>
    <nav>
      <a href="#plates">Plates</a>
    </nav>
  </header>

  <section class="hero">
    <picture>
      <source media="(min-width: 800px)" srcset="images/night.jpg">
      <img src="images/stones.jpg" alt="A pale green luna moth glowing against a dark background">
    </picture>
    <div class="hero-text">
      <div>
        <h1>Luna Moth</h1>
        <p class="latin">Actias luna</p>
      </div>
      <a class="button" href="#plates">See the plates <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 4l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a>
    </div>
  </section>

  <main id="main">

    <section class="intro">
      <p>One of the most striking moths in North America, and one most people will never see. Adults live for about a week, fly only at night, and never eat.</p>
    </section>

    <section class="plates" id="plates">
      <h2>Rarely <em>seen</em></h2>

      <figure>
        <img src="images/wings.jpg" alt="A luna moth with its pale green wings spread open over leaves">
        <figcaption>
          <span class="label">Plate I Wings</span>
          <p>Pale lime green, about 8 to 11.5 cm across, with one eyespot on each wing.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="images/tails.jpg" alt="A luna moth hanging under white mountain laurel flowers">
        <figcaption>
          <span class="label">Plate II Tails</span>
          <p>The long tails on its back wings may help it escape bats.</p>
        </figcaption>
      </figure>

      <figure class="tall">
        <img src="images/hero.jpg" alt="A luna moth resting among dried wildflowers">
        <figcaption>
          <span class="label">Plate III Edges</span>
          <p>The front edge of each wing is lined in a thin band of maroon to brown.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="images/night.jpg" alt="A luna moth flying in the dark">
        <figcaption>
          <span class="label">Plate IV Night</span>
          <p>Adults only fly after dark, which is why so few people see one.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="images/color.jpg" alt="A luna moth resting on pale purple orchids">
        <figcaption>
          <span class="label">Plate V Color</span>
          <p>Spring moths lean more blue, and summer moths lean more yellow.</p>
        </figcaption>
      </figure>

      <figure class="square">
        <img src="images/stones.jpg" alt="A luna moth resting on dark river stones">
        <figcaption>
          <span class="label">Plate VI One Week</span>
          <p>Adults have no working mouth and never eat. They live off energy stored as caterpillars.</p>
        </figcaption>
      </figure>
    </section>

  </main>

  <footer>
    <a class="logo" href="#">Luna Moth</a>
    <p class="latin">Actias luna</p>
    <p class="credit">Content adapted from <a href="https://en.wikipedia.org/wiki/Luna_moth">Wikipedia</a></p>
  </footer>

</body>
</html>
